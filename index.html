<!DOCTYPE html>
<html>

<head>

<title>My Search Site</title>

<style>

body{
font-family:Arial;
padding:40px;
}

input{
width:300px;
padding:10px;
}

.result{
border:1px solid gray;
padding:10px;
margin:5px;
}

</style>

</head>

<body>

<h1>Search Site</h1>

<input
id="search"
placeholder="Search..."
>

<div id="results"></div>

<script>

const data=[
"Apple",
"Banana",
"Orange",
"Phone",
"Computer",
"AI"
];

const search=
document.getElementById("search");

search.addEventListener(
"input",
()=>{

let q=
search.value.toLowerCase();

let filtered=
data.filter(
x=>
x.toLowerCase()
.includes(q)
);

document
.getElementById(
"results"
)
.innerHTML=

filtered
.map(
x=>
`<div class="result">
${x}
</div>`
)
.join("");

}
);

</script>

</body>

</html>
